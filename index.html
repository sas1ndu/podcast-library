<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Podcast Library</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="container">

  <header>
    <h1>Podcast Library</h1>
    <p>Upload and listen to your study podcasts.</p>
  </header>


  <section class="card">

    <h2>Upload Podcast</h2>

    <input
      type="file"
      id="audioFile"
      accept="audio/*"
    >

    <button id="uploadButton">
      Upload to Cloud
    </button>


    <div
      id="progressContainer"
      class="progress-container hidden"
    >

      <div
        id="progressBar"
        class="progress-bar"
      ></div>

    </div>

    <p id="uploadStatus"></p>

  </section>


  <section
    id="playerSection"
    class="card hidden"
  >

    <h2 id="audioTitle">
      Podcast
    </h2>

    <audio
      id="audioPlayer"
      controls
    ></audio>


    <div class="controls">

      <button id="backButton">
        -15 sec
      </button>

      <button id="forwardButton">
        +15 sec
      </button>

    </div>


    <div class="speed-control">

      <label for="speed">
        Speed
      </label>

      <select id="speed">

        <option value="0.5">0.5×</option>
        <option value="0.75">0.75×</option>
        <option value="1" selected>1×</option>
        <option value="1.25">1.25×</option>
        <option value="1.5">1.5×</option>
        <option value="1.75">1.75×</option>
        <option value="2">2×</option>

      </select>

    </div>


    <div
      id="shareSection"
      class="share-section hidden"
    >

      <p>
        Audio link
      </p>

      <input
        id="shareLink"
        readonly
      >

      <button id="copyButton">
        Copy Link
      </button>

    </div>

  </section>

</main>


<script src="app.js"></script>

</body>
</html>
